<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета и контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>No-Till</h1>
            <nav>
                <a href="index.html">Главная</a>
                <a href="about.html">О технологии</a>
                <a href="benefits.html">Преимущества</a>
                <a href="contacts.html">Анкета и контакты</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="container form-section">
            <h2>Оставьте свои данные</h2>
            <form id="userForm">
                <label for="fio">ФИО</label>
                <input type="text" id="fio" name="fio" placeholder="Введите ваше ФИО" required>

                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>

                <button type="submit">Отправить</button>
                <p id="formMessage" class="form-message"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container footer-contacts">
            <div class="contact-card">
                <h4>Голец Анна</h4>
                <p>+7-XXX-XXX-XX-XX</p>
            </div>
            <div class="contact-card">
                <h4>Мокрикова Ангелина</h4>
                <p>+7-XXX-XXX-XX-XX</p>
            </div>
            <div class="contact-card">
                <h4>Сухаревская Анастасия</h4>
                <p>+7-XXX-XXX-XX-XX</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault(); // отменяем перезагрузку 

            const fio = document.getElementById('fio').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const messageEl = document.getElementById('formMessage');

            if (!fio || !phone) {
                messageEl.textContent = 'Пожалуйста, заполните все поля.';
                messageEl.style.color = 'red';
                return;
            }

            // Здесь можно было бы отправить данные на сервер через fetch, но для демо просто покажем успех
            messageEl.textContent = `Спасибо, ${fio}! Ваши данные приняты.`;
            messageEl.style.color = 'green';

            // Очистка формы (по желанию)
            document.getElementById('fio').value = '';
            document.getElementById('phone').value = '';
        });
    </script>
</body>
</html>
